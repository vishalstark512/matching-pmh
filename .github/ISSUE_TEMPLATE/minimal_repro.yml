name: Minimal repro (developers)
description: Bug or integration issue with wizard output
title: "[repro]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Run `pmh-train route --wizard` and paste the snippet. See [13 tasks](https://github.com/vishalstark512/matching-pmh/blob/main/docs/tasks/index.md).
  - type: dropdown
    id: golden_path
    attributes:
      label: Paper task
      options:
        - T1 classical / sklearn
        - T4A vision domain
        - T7A LLM style
        - Other (see docs/tasks/)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: matching-pmh version
      placeholder: pip show matching-pmh
    validations:
      required: true
  - type: textarea
    id: applicability
    attributes:
      label: check_applicability / preflight output
      description: Verdict and preflight= pass|marginal|fail
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal script (20 lines) + full traceback
    validations:
      required: true
