site_name: matching-pmh
site_description: Domain-robust training for PyTorch and sklearn — train on site A, deploy on site B
site_url: https://vishalstark512.github.io/matching-pmh/
repo_url: https://github.com/vishalstark512/matching-pmh
repo_name: vishalstark512/matching-pmh
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md

  - Adopt:
      - "★ Find your application": APPLICATIONS.md
      - Three gates: START_HERE.md
      - Site map: MAP.md
      - Golden paths (G1–G4): GOLDEN_PATHS.md
      - Will PMH help?: WHEN_PMH_HELPS.md
      - Troubleshooting: TROUBLESHOOTING.md
      - What is PMH? (background): WHAT_IS_PMH.md

  - Integrate:
      - Onboarding:
          - First hour: FIRST_HOUR.md
          - Your project: GETTING_STARTED.md
      - CLI & tools:
          - CLI (route, wizard, doctor): cli.md
          - Colab: COLAB.md
          - Demo output: DEMO_OUTPUT.md
      - Shift & compare:
          - Subtypes D1–D7: NUISANCE_SUBTYPES.md
          - vs CORAL: COMPARE_TO_CORAL.md
      - Data & deployment:
          - Data layout: DATA_LAYOUT.md
          - Deployment bundle: DEPLOYMENT.md
          - Custom geometry: CUSTOM_GEOMETRY.md
      - By stack:
          - Hooks: hooks.md
          - sklearn: sklearn.md
          - PyTorch (low-level): integrations.md
          - Lightning (G1b): integrations-lightning.md
          - HF Trainer (G3b): integrations-hf-trainer.md
          - HF (low-level): integrations-hf.md
      - API:
          - Overview: api/index.md
          - Developer API: api/developer.md
          - PMHTrainer: api/pmh-trainer.md
          - Subtypes: api/subtypes.md
          - Custom geometry: api/custom.md
          - Deployment: api/deployment.md
          - Training primitives: training.md

  - Gallery:
      - Overview: gallery/README.md
      - Vision: gallery/vision.md
      - Tabular: gallery/tabular.md
      - NLP: gallery/nlp.md

  - Research:
      - Paper alignment: PAPER_ALIGNMENT.md
      - Fidelity by subtype: FIDELITY_BY_SUBTYPE.md
      - Recipe cards: recipes/README.md
      - Walkthroughs (tiered index): walkthroughs/index.md
      - Falsification controls: walkthroughs/08-falsification-controls.md
      - Office-31 real data: walkthroughs/19-office31-real-data.md
      - Benchmarks: BENCHMARKS.md
      - Correct usage: CORRECT_USAGE.md
      - Adaptation workbook: ADAPTATION_WORKBOOK.md

  - Reference:
      - Estimators D1–D7: estimators/index.md
      - Theory: THEORY.md
      - Datasets: datasets.md

  - Contributors:
      - Doc maintenance: DOCS_GUIDE.md
      - Subtype plan: NUISANCE_SUBTYPE_PLAN.md
      - Developer onboarding plan: DEVELOPER_ONBOARDING_PLAN.md
      - Roadmap: ROADMAP.md
      - Philosophy: PHILOSOPHY.md
      - Architecture patterns: ARCHITECTURES.md
      - Hybrid nuisances: HYBRID_NUISANCE.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            members_order: source
            heading_level: 3

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
