site_name: matching-pmh
site_description: Domain-robust training for PyTorch and sklearn — train on site A, deploy on site B
site_url: https://vishalstark512.github.io/matching-pmh/
repo_url: https://github.com/vishalstark512/matching-pmh
repo_name: vishalstark512/matching-pmh
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - "Start here":
      - What is PMH?: WHAT_IS_PMH.md
      - Will it help?: WHEN_PMH_HELPS.md
      - Your first hour: FIRST_HOUR.md
      - Shift types (D1–D7): NUISANCE_SUBTYPES.md
      - Golden paths (G1–G4, G1b/G3b): GOLDEN_PATHS.md
      - Custom geometry: CUSTOM_GEOMETRY.md
      - Data layout (.npy / folders): DATA_LAYOUT.md
      - Deployment bundle: DEPLOYMENT.md
      - Integrate your project: GETTING_STARTED.md
      - Troubleshooting: TROUBLESHOOTING.md
  - Integrate:
      - CLI & wizard: cli.md
      - Colab: COLAB.md
      - Developer API: api/developer.md
      - PMHTrainer: api/pmh-trainer.md
      - Subtypes API: api/subtypes.md
      - Custom geometry API: api/custom.md
      - Deployment API: api/deployment.md
      - Hooks: hooks.md
      - sklearn: sklearn.md
      - "HF Trainer (G3b)": integrations-hf-trainer.md
      - "Lightning (G1b)": integrations-lightning.md
      - vs CORAL: COMPARE_TO_CORAL.md
      - Demo output: DEMO_OUTPUT.md
  - Gallery:
      - Overview: gallery/README.md
      - Vision: gallery/vision.md
      - Tabular: gallery/tabular.md
      - NLP: gallery/nlp.md
  - Research:
      - Paper alignment: PAPER_ALIGNMENT.md
      - Fidelity by subtype: FIDELITY_BY_SUBTYPE.md
      - Recipe cards: recipes/README.md
      - "Recipe D1 (T1)": recipes/t1-office31-d1.md
      - "Recipe D2 (T2A)": recipes/t2a-vit-isotropic.md
      - "Recipe D4 (T4)": recipes/t4-domain-d4.md
      - "Recipe D7 (T7A)": recipes/t7a-style-d7.md
      - Walkthroughs (all): walkthroughs/index.md
      - Controls & falsification: walkthroughs/08-falsification-controls.md
      - Office-31 real data: walkthroughs/19-office31-real-data.md
      - Paper presets: walkthroughs/paper-presets-by-block.md
      - Benchmarks: BENCHMARKS.md
      - Correct usage: CORRECT_USAGE.md
      - Adaptation workbook: ADAPTATION_WORKBOOK.md
  - Reference:
      - Estimators (D1–D7): estimators/index.md
      - Training API: training.md
      - Theory: THEORY.md
      - Datasets: datasets.md
      - PyTorch integration: integrations.md
      - HF (low-level): integrations-hf.md
  - Contributors:
      - Doc maintenance: DOCS_GUIDE.md
      - Subtype rollout plan: NUISANCE_SUBTYPE_PLAN.md
      - Developer onboarding plan: DEVELOPER_ONBOARDING_PLAN.md
      - Roadmap: ROADMAP.md
      - Philosophy: PHILOSOPHY.md
      - Architecture patterns: ARCHITECTURES.md
      - Hybrid nuisances: HYBRID_NUISANCE.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            members_order: source
            heading_level: 3

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
