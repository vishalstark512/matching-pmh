      - Colab (no install): COLAB.md
      - Demo output preview: DEMO_OUTPUT.md
      - Getting started: GETTING_STARTED.md
      - Choose your setup: CHOOSE_YOUR_SETUP.md
      - Quickstart (10 min): QUICKSTART.md
      - Troubleshooting: TROUBLESHOOTING.md
      - vs CORAL: COMPARE_TO_CORAL.md
      - Adaptation workbook: ADAPTATION_WORKBOOK.md
      - Adapt your pipeline: ADAPT_YOUR_PIPELINE.md
      - Onboarding plan (contributors): DEVELOPER_ONBOARDING_PLAN.md
      - Legacy redirect: getting-started.md
  - Research:
