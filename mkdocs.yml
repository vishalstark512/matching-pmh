site_name: matching-pmh
site_description: Domain-robust training for PyTorch and sklearn — train on site A, deploy on site B
site_url: https://vishalstark512.github.io/matching-pmh/
repo_url: https://github.com/vishalstark512/matching-pmh
repo_name: vishalstark512/matching-pmh
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - content.code.copy
    - search.suggest

nav:
  - Start:
      - What problem PMH solves: index.md
      - Adopt PMH: ../ADOPT.md
      - Five-step workflow: FIVE_STEP_RECIPE.md
      - Will PMH help?: WHEN_PMH_HELPS.md

  - Use PMH:
      - Find my task: APPLICATIONS.md
      - 13 task patterns: TASK_PATTERNS.md
      - Recipes to copy: GOLDEN_PATHS.md
      - Integrate (install & CLI): INTEGRATE.md
      - Troubleshooting: TROUBLESHOOTING.md
      - Parameters cheat sheet: PARAMETERS_CHEATSHEET.md

  - Evidence:
      - Prove it worked: walkthroughs/08-falsification-controls.md
      - Examples by task: walkthroughs/index.md
      - Daily AI job map: walkthroughs/DAILY_AI_USE.md
      - Published evidence map: PAPER_ALIGNMENT.md
      - vs CORAL: COMPARE_TO_CORAL.md

  - Reference:
      - What is deployment shift?: WHAT_IS_DEPLOYMENT_SHIFT.md
      - PMH parameters: PMH_PARAMETERS.md
      - Advanced shift types: NUISANCE_SUBTYPES.md
      - Advanced estimators: estimators/index.md
      - Custom change directions: CUSTOM_GEOMETRY.md
      - API reference: api/index.md
      - Theory: THEORY.md
      - 60s pipeline script: PIPELINE_60S.md
      - Contributor doc guide: DOCS_GUIDE.md
      - Meta-structure: META_STRUCTURE.md

plugins:
  - search
  - redirects:
      redirect_maps:
        START_HERE.md: FIVE_STEP_RECIPE.md
        MAP.md: FIVE_STEP_RECIPE.md
        WHAT_IS_PMH.md: WHAT_IS_DEPLOYMENT_SHIFT.md
        MODES.md: FIVE_STEP_RECIPE.md
        FIRST_HOUR.md: INTEGRATE.md
        GETTING_STARTED.md: INTEGRATE.md
        COLAB.md: INTEGRATE.md
        DEMO_OUTPUT.md: INTEGRATE.md
        QUICKSTART.md: APPLICATIONS.md
        getting-started.md: APPLICATIONS.md
        CHOOSE_YOUR_SETUP.md: APPLICATIONS.md
        ADAPT_YOUR_PIPELINE.md: INTEGRATE.md
        ARCHITECTURES.md: FIVE_STEP_RECIPE.md
        ARCHITECTURE.md: META_STRUCTURE.md
        hooks.md: INTEGRATE.md
        sklearn.md: GOLDEN_PATHS.md
        integrations.md: GOLDEN_PATHS.md
        integrations-lightning.md: GOLDEN_PATHS.md
        integrations-hf.md: GOLDEN_PATHS.md
        integrations-hf-trainer.md: GOLDEN_PATHS.md
        gallery/README.md: GOLDEN_PATHS.md
        gallery/vision.md: GOLDEN_PATHS.md
        gallery/tabular.md: GOLDEN_PATHS.md
        gallery/nlp.md: GOLDEN_PATHS.md
        ADAPTATION_WORKBOOK.md: walkthroughs/index.md
        FIDELITY_BY_SUBTYPE.md: PAPER_ALIGNMENT.md
        BENCHMARKS.md: walkthroughs/index.md
        CORRECT_USAGE.md: PAPER_ALIGNMENT.md
        training.md: api/index.md
        api/tier0.md: api/index.md
        api/recipe.md: api/index.md
        api/protocol.md: api/index.md
        api/developer.md: api/index.md
        api/pmh-trainer.md: api/index.md
        api/subtypes.md: api/index.md
        api/custom.md: api/index.md
        api/deployment.md: api/index.md
        DEVELOPER_ONBOARDING_PLAN.md: DOCS_GUIDE.md
        NUISANCE_SUBTYPE_PLAN.md: DOCS_GUIDE.md
        ROADMAP.md: DOCS_GUIDE.md
        PHILOSOPHY.md: META_STRUCTURE.md
        HYBRID_NUISANCE.md: estimators/index.md
        datasets.md: INTEGRATE.md
        DATA_POLICY.md: DOCS_GUIDE.md
        DATA_LAYOUT.md: INTEGRATE.md
        DEPLOYMENT.md: INTEGRATE.md
        cli.md: INTEGRATE.md
        GITHUB_PAGES_SETUP.md: DOCS_GUIDE.md
        nuisance_types.md: NUISANCE_SUBTYPES.md
        estimators/d1.md: estimators/index.md
        estimators/d2.md: estimators/index.md
        estimators/d3.md: estimators/index.md
        estimators/d4.md: estimators/index.md
        estimators/d5.md: estimators/index.md
        estimators/d6.md: estimators/index.md
        estimators/d7.md: estimators/index.md
        recipes/README.md: walkthroughs/index.md
        recipes/t1-office31-d1.md: PAPER_ALIGNMENT.md
        recipes/t2a-vit-isotropic.md: PAPER_ALIGNMENT.md
        recipes/t4-domain-d4.md: PAPER_ALIGNMENT.md
        recipes/t7a-style-d7.md: PAPER_ALIGNMENT.md
        benchmarks/office31_amazon_to_dslr.md: walkthroughs/index.md
        benchmarks/office31_synthetic_reference.md: walkthroughs/index.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            members_order: source
            heading_level: 3

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
