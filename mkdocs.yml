      - "Recipe T1 Office-31": recipes/t1-office31-d1.md
      - "Recipe T2A ViT D2": recipes/t2a-vit-isotropic.md
      - "Recipe T4 domain D4": recipes/t4-domain-d4.md
      - "Recipe T7A LLM D7": recipes/t7a-style-d7.md
      - Benchmarks & TDI: BENCHMARKS.md
      - Paper presets (T1–T7): walkthroughs/paper-presets-by-block.md
      - Reference table (synthetic): benchmarks/office31_synthetic_reference.md
      - Reference table (Office-31): benchmarks/office31_amazon_to_dslr.md
      - Data policy: DATA_POLICY.md
  - Theory: THEORY.md
  - Integration:
      - Hook cookbook: hooks.md
      - Hybrid nuisances: HYBRID_NUISANCE.md
      - Architecture patterns: ARCHITECTURES.md
      - Design philosophy: PHILOSOPHY.md
      - Roadmap: ROADMAP.md
  - Gallery:
      - Overview: gallery/README.md
      - Vision: gallery/vision.md
      - Tabular: gallery/tabular.md
      - NLP: gallery/nlp.md
  - Walkthroughs:
      - Overview: walkthroughs/index.md
      - Paper presets (T1–T7): walkthroughs/paper-presets-by-block.md
      - "1 PyTorch D4": walkthroughs/01-pytorch-domain-d4.md
      - "2 ResNet D4": walkthroughs/02-resnet-vision-d4.md
      - "3 Office-31": walkthroughs/03-office31-sklearn-d1.md
